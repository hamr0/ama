<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>weareasking</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="waa-header">
    <span class="waa-header-title">weareasking</span>
    <div class="waa-header-actions">
      <button class="waa-settings" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.48.48 0 00.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
      </button>
    </div>
  </div>

  <div class="waa-provider-bar">
    <span>Using</span>
    <select class="waa-provider-select" id="provider-select">
      <option value="chatgpt-web">ChatGPT</option>
      <option value="claude-web">Claude</option>
      <option value="gemini-web">Gemini</option>
    </select>
  </div>

  <div class="waa-messages" id="messages">
    <div class="waa-empty" id="empty-state">Ask this site anything.<br>The agent will analyze the page structure to find your answer.</div>
  </div>

  <div class="waa-pills" id="pills">
    <button class="waa-pill" data-action="summarize">Summarize</button>
    <button class="waa-pill" data-action="contact">Contact/FAQ</button>
    <button class="waa-pill" data-action="asksite" id="pill-asksite" title="No site search detected">Ask Site</button>
    <button class="waa-pill disabled" data-action="compare" title="Coming soon">Compare</button>
  </div>

  <div class="waa-input-area">
    <input class="waa-input" id="input" type="text" placeholder="Ask this site..." autocomplete="off">
    <button class="waa-send" id="send-btn">Ask</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
