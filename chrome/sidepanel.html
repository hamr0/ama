<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AMA</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="waa-header">
    <span class="waa-header-title">ama</span>
    <div class="waa-header-actions">
      <button class="waa-settings" title="Settings" aria-label="Settings">[cfg]</button>
    </div>
  </div>

  <div class="waa-provider-bar">
    <span>Using</span>
    <select class="waa-provider-select" id="provider-select">
      <option value="chatgpt-web">ChatGPT</option>
      <option value="claude-web">Claude</option>
      <option value="gemini-web">Gemini</option>
    </select>
  </div>

  <div class="waa-site-bar" id="site-bar">
    <span class="waa-site-dot"></span>
    <span class="waa-site-name" id="site-name">No page loaded</span>
  </div>

  <div class="waa-messages" id="messages">
    <div class="waa-empty" id="empty-state">Ask anything about this site.<br>I'll read multiple pages and answer in your language.</div>
  </div>

  <div class="waa-pills" id="pills">
    <button class="waa-pill" data-action="search">Search</button>
    <button class="waa-pill" data-action="summarize">Summarize</button>
    <button class="waa-pill" data-action="contact">Contact</button>
    <button class="waa-pill disabled" data-action="asksite" id="pill-asksite" title="No site search detected">Site Search</button>
    <button class="waa-pill" data-action="compare" title="Compare open tabs">Compare</button>
  </div>

  <div class="waa-input-area">
    <input class="waa-input" id="input" type="text" placeholder="Ask anything about this site..." autocomplete="off">
    <button class="waa-send" id="send-btn">Ask</button>
  </div>

  <script src="theme.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
