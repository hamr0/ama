<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>weareasking — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      padding: 40px 20px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }

    /* Provider cards */
    .provider-cards { display: flex; flex-direction: column; gap: 12px; }
    .provider-card {
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .provider-card:hover { border-color: #ccc; }
    .provider-card.selected { border-color: #1a1a1a; background: #fafafa; }
    .provider-card-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
    }
    .provider-card-body { flex: 1; }
    .provider-card-name { font-size: 14px; font-weight: 600; }
    .provider-card-desc { font-size: 12px; color: #888; margin-top: 2px; }
    .provider-card-status {
      font-size: 11px; margin-top: 4px;
      display: flex; align-items: center; gap: 5px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }
    .status-dot.green { background: #22c55e; }
    .status-dot.gray { background: #ccc; }
    .status-dot.checking { background: #eab308; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    .provider-card-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-login {
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      font-family: inherit; cursor: pointer; border: 1px solid #ddd;
      background: #fff; color: #1a1a1a;
    }
    .btn-login:hover { background: #f0f0f0; }

    /* Save */
    .actions { margin-top: 28px; display: flex; gap: 12px; }
    button.btn-save {
      padding: 10px 20px; border-radius: 8px; font-size: 14px;
      font-family: inherit; cursor: pointer; border: none;
      background: #1a1a1a; color: #fff;
    }
    button.btn-save:hover { background: #333; }
    .status-msg {
      font-size: 13px; color: #22863a; margin-top: 12px; display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>weareasking</h1>
    <p class="subtitle">Choose your AI provider. Log in with your existing account — no API key needed.</p>

    <div class="provider-cards">
      <div class="provider-card" data-provider="chatgpt-web">
        <div class="provider-card-icon">
          <svg width="36" height="36" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <rect width="16" height="16" rx="3.5" fill="#10a37f"/>
            <g transform="translate(1.5,1.5) scale(0.8125)">
              <path d="M14.949 6.547a3.94 3.94 0 0 0-.348-3.273 4.11 4.11 0 0 0-4.4-1.934A4.1 4.1 0 0 0 8.423.2 4.15 4.15 0 0 0 6.305.086a4.1 4.1 0 0 0-1.891.948 4.04 4.04 0 0 0-1.158 1.753 4.1 4.1 0 0 0-1.563.679A4 4 0 0 0 .554 4.72a3.99 3.99 0 0 0 .502 4.731 3.94 3.94 0 0 0 .346 3.274 4.11 4.11 0 0 0 4.402 1.933c.382.425.852.764 1.377.995.526.231 1.095.35 1.67.346 1.78.002 3.358-1.132 3.901-2.804a4.1 4.1 0 0 0 1.563-.68 4 4 0 0 0 1.14-1.253 3.99 3.99 0 0 0-.506-4.716m-6.097 8.406a3.05 3.05 0 0 1-1.945-.694l.096-.054 3.23-1.838a.53.53 0 0 0 .265-.455v-4.49l1.366.778q.02.011.025.035v3.722c-.003 1.653-1.361 2.992-3.037 2.996m-6.53-2.75a2.95 2.95 0 0 1-.36-2.01l.095.057L5.29 12.09a.53.53 0 0 0 .527 0l3.949-2.246v1.555a.05.05 0 0 1-.022.041L6.473 13.3c-1.454.826-3.311.335-4.15-1.098m-.85-6.94A3.02 3.02 0 0 1 3.07 3.949v3.785a.51.51 0 0 0 .262.451l3.93 2.237-1.366.779a.05.05 0 0 1-.048 0L2.585 9.342a2.98 2.98 0 0 1-1.113-4.094zm11.216 2.571L8.747 5.576l1.362-.776a.05.05 0 0 1 .048 0l3.265 1.86a3 3 0 0 1 1.173 1.207 2.96 2.96 0 0 1-.27 3.2 3.05 3.05 0 0 1-1.36.997V8.279a.52.52 0 0 0-.276-.445m1.36-2.015-.097-.057-3.226-1.855a.53.53 0 0 0-.53 0L6.249 6.153V4.598a.04.04 0 0 1 .019-.04L9.533 2.7a3.07 3.07 0 0 1 3.257.139c.474.325.843.778 1.066 1.303.223.526.289 1.103.191 1.664zM5.503 8.575 4.139 7.8a.05.05 0 0 1-.026-.037V4.049c0-.57.166-1.127.476-1.607s.752-.864 1.275-1.105a3.08 3.08 0 0 1 3.234.41l-.096.054-3.23 1.838a.53.53 0 0 0-.265.455zm.742-1.577 1.758-1 1.762 1v2l-1.755 1-1.762-1z" fill="#fff"/>
            </g>
          </svg>
        </div>
        <div class="provider-card-body">
          <div class="provider-card-name">ChatGPT</div>
          <div class="provider-card-desc">Uses your ChatGPT subscription</div>
          <div class="provider-card-status">
            <span class="status-dot checking"></span>
            <span class="status-text">Checking...</span>
          </div>
        </div>
        <div class="provider-card-actions">
          <button class="btn-login" data-url="https://chatgpt.com">Log in</button>
        </div>
      </div>

      <div class="provider-card" data-provider="claude-web">
        <div class="provider-card-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="5" fill="#D97757"/>
            <g transform="translate(3,3) scale(0.75)">
              <path d="M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z" fill="#fff"/>
            </g>
          </svg>
        </div>
        <div class="provider-card-body">
          <div class="provider-card-name">Claude</div>
          <div class="provider-card-desc">Uses your Claude subscription</div>
          <div class="provider-card-status">
            <span class="status-dot checking"></span>
            <span class="status-text">Checking...</span>
          </div>
        </div>
        <div class="provider-card-actions">
          <button class="btn-login" data-url="https://claude.ai">Log in</button>
        </div>
      </div>

      <div class="provider-card" data-provider="gemini-web">
        <div class="provider-card-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="5" fill="#8E75B2"/>
            <g transform="translate(3,3) scale(0.75)">
              <path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81" fill="#fff"/>
            </g>
          </svg>
        </div>
        <div class="provider-card-body">
          <div class="provider-card-name">Gemini</div>
          <div class="provider-card-desc">Uses your Google account</div>
          <div class="provider-card-status">
            <span class="status-dot checking"></span>
            <span class="status-text">Checking...</span>
          </div>
        </div>
        <div class="provider-card-actions">
          <button class="btn-login" data-url="https://gemini.google.com">Log in</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-save" id="save">Save</button>
    </div>
    <p class="status-msg" id="status">Settings saved.</p>
  </div>
  <script src="options.js"></script>
</body>
</html>
